name: CI/CD Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Java 및 빌드 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' 
          distribution: 'temurin'

      # 2. 스프링 부트 빌드 (Maven 버전)
      - name: Build Spring Boot
        run: |
          cd spring_chs_mini
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 이미지 빌드 및 푸시 (파이썬 추가)
      - name: Build and Push Images
        run: |
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/spring-app:latest ./spring_chs_mini --push
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/react-app:latest ./react_chs_mini --push
          # --- 파이썬 AI 서버 추가 ---
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/stock-ai:latest ./stock-ai --push

      # 6. 오라클 서버에 SSH 접속하여 배포
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # 1. 기존 컨테이너 중지 및 삭제 (파이썬 추가)
            docker stop spring-container react-container python-container 2>/dev/null || true
            docker rm spring-container react-container python-container 2>/dev/null || true
            
            # 2. 최신 이미지 풀
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-app:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/react-app:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/stock-ai:latest
            
            # 3. 파이썬 컨테이너 먼저 실행 (스프링이 참조해야 하므로)
            docker run -d --name python-container \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/stock-ai:latest

            # 4. 스프링 컨테이너 실행 (--link 또는 네트워크 설정 필요)
            # --link python-container:python-api 를 추가하여 스프링에서 'python-api'라는 이름으로 접근 가능하게 합니다.
            docker run -d --name spring-container \
              -p 8080:8080 \
              -v /home/ubuntu/upload:/upload \
              --link python-container:python-api \
              ${{ secrets.DOCKER_USERNAME }}/spring-app:latest
              
            docker run -d --name react-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/react-app:latest