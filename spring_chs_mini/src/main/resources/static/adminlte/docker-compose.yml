version: "3"
services:
  admin:
    build: .
    command: npm run dev
    ports:
      - 3000:3000
      - 3001:3001
    volumes:
    - .:/code
    - /code/node_modules

    python-api:
    build: 
      context: ./stock-ai  # 루트 디렉토리 기준 stock-ai 폴더로 이동하여 빌드
    container_name: python-stock-api
    ports:
      - "8000:8000"
    restart: always
